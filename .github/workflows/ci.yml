name: VisualCat CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap, fast gates that do not need a build. They run first so an obvious
  # documentation or credential mistake does not wait on the 3-OS matrix.
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Tags and full history are required to check changelog links and to
          # scan every reachable blob.
          fetch-depth: 0
      - name: Verify documentation and version consistency
        run: pwsh ./tools/verify-docs.ps1
      # A workflow step that does not parse runs none of itself, and the release
      # workflow's steps are unreachable from a pull request, so their first
      # execution has always been the tag. One of them shipped with an
      # unterminated expression and took every desktop job of the v2.0.14 release
      # down with it. This reads the shell bodies without running them.
      - name: Verify workflow shell bodies and action pinning
        run: pwsh ./tools/verify-workflows.ps1
      - name: Scan for secrets
        run: pwsh ./tools/scan-secrets.ps1 -History

  desktop-core:
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props
      - name: Restore documented desktop solution
        run: dotnet restore VisualCat.Desktop.slnx
      - name: Verify formatting
        if: runner.os == 'Linux'
        run: dotnet format VisualCat.Desktop.slnx --no-restore --verify-no-changes --verbosity diagnostic
      - name: Build documented desktop solution
        run: dotnet build VisualCat.Desktop.slnx --no-restore --configuration Release
      - name: Test
        if: runner.os != 'Linux'
        # Test projects and the process-wide Avalonia UI assembly are serialized independently.
        # The wrapper also preserves TRX files and turns failures into check annotations, so a
        # platform-only regression remains diagnosable without access to the raw Actions log.
        run: pwsh ./tools/test-ci.ps1
      - name: Preserve failed test results
        if: failure() && runner.os != 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-${{ runner.os }}
          path: TestResults/ci/*.trx
          if-no-files-found: warn
      - name: Test with coverage
        if: runner.os == 'Linux'
        run: dotnet test VisualCat.Desktop.slnx --no-restore --no-build --configuration Release -m:1 --collect:"XPlat Code Coverage" --results-directory TestResults
      - name: Run README CLI smoke test
        if: runner.os == 'Linux'
        run: |
          dotnet run --project src/VisualCat.Cli --configuration Release --no-build -- index samples/logcat_small.txt --output ci.vcat
          dotnet run --project src/VisualCat.Cli --configuration Release --no-build -- verify ci.vcat
          dotnet run --project src/VisualCat.Cli --configuration Release --no-build -- --version
          pwsh ./tools/verify-cli-help.ps1
      # Recorded on every platform and compared in output-parity below. Every text
      # export used to carry the host's own newline, so one session exported on
      # Linux and on Windows differed by 5,001 carriage returns and nothing else —
      # correct on each machine, undiffable between them. No single runner can see
      # that, so each one records what it wrote and the comparison is its own job.
      - name: Record this platform's text output fingerprint
        shell: pwsh
        run: pwsh ./tools/verify-output-parity.ps1 -Record "fingerprints/${{ runner.os }}.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: output-fingerprint-${{ runner.os }}
          path: fingerprints/*.txt
          if-no-files-found: error
      - name: Create coverage report
        if: runner.os == 'Linux'
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.10
          reportgenerator "-reports:TestResults/**/coverage.cobertura.xml" "-targetdir:coverage-report" "-reporttypes:Html;MarkdownSummaryGithub;Badges" "-assemblyfilters:+VisualCat.*;-*.Tests"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          use_oidc: true
          files: TestResults/**/coverage.cobertura.xml
          flags: unit-tests
          fail_ci_if_error: false
      - name: Preserve coverage report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage-report
          if-no-files-found: error

  # The promise that a session exports the same bytes everywhere can only be
  # checked by something that has seen every platform's output at once.
  output-parity:
    needs: desktop-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: output-fingerprint-*
          path: fingerprints
          merge-multiple: true
      - name: Compare every platform's text output
        run: pwsh ./tools/verify-output-parity.ps1 -Compare fingerprints

  # The packaging path is otherwise first executed by a tag. That is where the
  # archives that scattered 240 generically-named assemblies into the user's
  # working directory lived undetected until a macOS live test found them, and
  # where the assertion written to stop it recurring turned out not to parse.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props
      # -Archive runs tools/verify-package-contents.ps1 over each finished archive
      # itself, which is where the layout, the notice files, the executable bit and
      # the single-top-level-directory rule are all asserted.
      - name: Package and verify the Linux archives
        run: pwsh ./tools/package.ps1 -Runtime linux-x64 -Archive
      - name: The desktop says what is wrong instead of dumping core
        run: |
          # No DISPLAY, a DISPLAY nothing is listening on, and an absent libX11 all
          # ended in a bare .NET stack trace printed twice and a SIGABRT — a core
          # dump of a log viewer for what is an ordinary mistake. The contract is
          # now exit 69 and one sentence naming vcat, and this is the only gate
          # that executes the desktop binary at all.
          dotnet publish src/VisualCat.Desktop/VisualCat.Desktop.csproj \
            --configuration Release --runtime linux-x64 --self-contained true \
            --output "$RUNNER_TEMP/headless"

          # A core dump here would be the very thing the fix exists to prevent, so
          # do not let the runner write one even if this regresses.
          ulimit -c 0
          set +e
          env -u DISPLAY -u WAYLAND_DISPLAY "$RUNNER_TEMP/headless/VisualCat" \
            > "$RUNNER_TEMP/out.txt" 2> "$RUNNER_TEMP/err.txt"
          code=$?
          set -e
          echo "exit=$code"
          echo "--- stderr ---"; cat "$RUNNER_TEMP/err.txt"

          if [ "$code" -ne 69 ]; then
            echo "::error::The desktop exited $code with no display; the documented contract is 69 (EX_UNAVAILABLE). 134 would mean it aborted."
            exit 1
          fi
          if ! grep -q 'vcat' "$RUNNER_TEMP/err.txt"; then
            echo "::error::The no-display message does not name vcat, which is the thing that needs no display."
            exit 1
          fi

          # The trace used to be printed by this product's handler and again by the
          # runtime's default one: 38 lines of identical trace in exactly the
          # situation where someone is hunting for one useful line. Match real frame
          # lines ("    at Namespace.Method(...)") rather than prose containing "at".
          frames=$(grep -cE '^[[:space:]]+at [A-Za-z_]+\.' "$RUNNER_TEMP/err.txt" || true)
          if [ "$frames" -ne 0 ]; then
            echo "::error::A stack trace reached the user for a configuration problem ($frames frame line(s))."
            exit 1
          fi

  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          workloads: android
      - run: dotnet restore src/VisualCat.Android/VisualCat.Android.csproj
      - name: Verify Android formatting
        run: dotnet format src/VisualCat.Android/VisualCat.Android.csproj --no-restore --verify-no-changes --verbosity diagnostic
      - run: dotnet build src/VisualCat.Android/VisualCat.Android.csproj --no-restore --configuration Release
      - name: Verify Android release guards and prerelease version code
        shell: pwsh
        run: |
          dotnet build src/VisualCat.Android/VisualCat.Android.csproj --no-restore --configuration Release -p:VisualCatFakeAppUpdate=true
          if ($LASTEXITCODE -eq 0) { throw 'A Release build incorrectly accepted VisualCatFakeAppUpdate=true.' }

          $properties = dotnet msbuild src/VisualCat.Android/VisualCat.Android.csproj -nologo `
            -t:_VisualCatValidateVersionCode -p:Version=2.1.0-alpha.2 `
            -p:VersionPrefix=2.1.0 -p:VisualCatBuildNumber=2 `
            -getProperty:ApplicationVersion -getProperty:Version -getProperty:VersionPrefix | ConvertFrom-Json
          if ($properties.Properties.Version -ne '2.1.0-alpha.2' -or
              $properties.Properties.VersionPrefix -ne '2.1.0' -or
              $properties.Properties.ApplicationVersion -ne '2010002') {
            throw "Android prerelease version metadata is not reproducible: $($properties | ConvertTo-Json -Compress)"
          }
