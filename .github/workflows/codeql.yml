name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # GitHub Free cannot accept code-scanning uploads from private repositories.
    # Public repositories enable it automatically; licensed private repositories
    # can opt in after enabling Code Security by setting CODEQL_ENABLED=true.
    if: github.event.repository.visibility == 'public' || vars.CODEQL_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
